# ============================================================================
# wg-forward: expose ONE docker-network service on this box's WireGuard IP.
#
# Replaces the old ad-hoc `alpine/socat` forwarders (pg-wg-forward on S1,
# minio-wg-forward on S2) since 2026-11-13: generic relay/tunnel binaries are
# what Hostinger's in-VM malware scanner flags (it hard-stopped S1 for
# wstunnel). HAProxy is a standard load balancer, TCP mode, no TLS changes.
#
# The container joins the target's docker network and publishes on the WG IP
# only, e.g. on S1 (Postgres for the S2 replica + S2 app):
#   docker run -d --name pg-wg-forward --restart unless-stopped \
#     --network unbottled_app-network -p 10.88.0.1:5432:5432 \
#     -e FWD_PORT=5432 -e FWD_TARGET=prod-postgres:5432 \
#     -v /root/ha-wg-forward/wg-forward.haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro \
#     haproxy:3.2-alpine
# and on S2 (MinIO replication target for S1):
#   ... --name minio-wg-forward -p 10.88.0.2:9000:9000 \
#     -e FWD_PORT=9000 -e FWD_TARGET=unbottled-minio:9000 ...
#
# Long timeouts: Postgres streaming replication and pooled app connections
# stay open for hours (wal_sender_timeout + TCP keepalive keep them alive).
# The docker resolver re-resolves the target, so a recreated target container
# with a new IP is picked up without restarting this proxy.
# ============================================================================
global
    log stdout format raw local0 notice
    maxconn 2000

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    accepted_payload_size 8192

defaults
    mode tcp
    log global
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 5s
    timeout client 24h
    timeout server 24h

frontend fwd
    bind :"${FWD_PORT}"
    default_backend target

backend target
    server t "${FWD_TARGET}" resolvers docker init-addr last,libc,none check inter 10s
