# ============================================================================
# Server 2 Caddy site config for unbottled, carried by a tiny PERSISTENT
# container so the vhosts survive app recreates (caddy-docker-proxy drops a
# container's sites the moment that container stops).
#
# Enable only after deploying the committed admission code and passing
# `bash scripts/ha-edge-canary.sh --activation` on both running images.
#   cd /root/unbottled && docker compose -p unbottled-edge \
#     -f docker-compose.s2-edge.yml up -d
#
# Sites (label prefix caddy_internal, this box's caddy-docker-proxy):
#   https://unbottled.ai      local unbottled-app first, Server 1 edge over HTTPS as
#                             fallback (lb_policy first). /ws* falls back to S1's
#                             split-port WS sidecar :4000. Drained (deploy, file
#                             /root/caddy_data/ha-drain/s2): Server 1 first for
#                             every NEW request; open streams/sockets stay.
#   https://www.unbottled.ai  308 -> apex
#   https://s2.unbottled.ai   direct test hostname for this node
#   http://unbottled.ai, http://www.unbottled.ai
#                             ACME HTTP-01 relay: tokens this Caddy does not
#                             own go once to Server 1's Caddy (loop guard
#                             header), so either box can renew no matter which
#                             IP Let's Encrypt resolves. Rest redirects to https.
# X-HA-Upstream (2026-11-17) on app responses names the upstream that served
# them (unbottled-app:3000 = this box, next-vibe-app:3000 = S1 fallback). The edge
# DNS health daemon keeps S2 in DNS only while that is unbottled-app:3000.
# Certs: Caddy-managed (HTTP-01 only; TLS-ALPN-01 disabled because it cannot be
# relayed). Server 1's Caddyfile carries the mirror-image config.
# ============================================================================
services:
  unbottled-edge:
    image: alpine:3.20
    container_name: unbottled-edge
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - caddy_internal
    labels:
      caddy_internal_10: "https://unbottled.ai"
      caddy_internal_10.header: '+Server-Timing "vibe-edge;desc=\"s2\", vibe-edge-request;desc=\"{http.request.uuid}\""'
      # Mirror S1's 5xx access log with a response correlation ID and upstream timing.
      caddy_internal_10.log: "unbottled_failures"
      caddy_internal_10.log.level: "ERROR"
      caddy_internal_10.log.format: "filter"
      caddy_internal_10.log.format.wrap: "json"
      caddy_internal_10.log.format.fields.request: "delete"
      caddy_internal_10.log.format.fields.resp_headers: "delete"
      caddy_internal_10.log.format.fields.user_id: "delete"
      caddy_internal_10.@meta_crawler.header_regexp: "User-Agent (?i)facebookexternalhit|meta-externalagent|meta-externalfetcher|meta-webindexer"
      caddy_internal_10.@next_asset.path: "/_next/*"
      caddy_internal_10.@next_bundle.path_regexp: '^/_next/static/chunks/[a-zA-Z0-9_./~-]+\.(js|css)$'
      caddy_internal_10.@public_badge.path_regexp: '^/images/badges/((dang|postmake|toolpilot)-(dark|light)\.png|(aitoolscapital|bestekitools)-(dark|light)\.svg|opensourcealternatives\.svg|whatsthebigdata\.jpg)$'
      caddy_internal_10.@app_api.path: "/api/*"
      caddy_internal_10.@realtime.path: "/ws*"
      caddy_internal_10.0_log_append: "@meta_crawler automation meta-crawler"
      caddy_internal_10.1_log_append: "@next_asset surface next-asset"
      caddy_internal_10.2_log_append: "@app_api surface api"
      caddy_internal_10.3_log_append: "@realtime surface websocket"
      caddy_internal_10.4_log_append: "edge s2"
      caddy_internal_10.5_log_append: "upstream {rp.upstream.host}"
      caddy_internal_10.6_log_append: "upstream_header_wait_ms {rp.upstream.latency_ms}"
      # Caddy 2.9 on S2 treats a leading < as part of the JSON field name.
      caddy_internal_10.7_log_append: "edge_request_id {http.request.uuid}"
      caddy_internal_10.8_log_append: "upstream_duration_ms {rp.upstream.duration_ms}"
      caddy_internal_10.9_log_append: "@next_bundle asset_path {http.request.orig_uri.path}"
      caddy_internal_10.10_log_append: "@public_badge asset_path {http.request.orig_uri.path}"
      caddy_internal_10.tls.issuer: "acme"
      caddy_internal_10.tls.issuer.disable_tlsalpn_challenge: ""
      caddy_internal_10.handle_errors: "502 503 504"
      caddy_internal_10.handle_errors.import: "/data/ha-routing/unavailable.caddy"
      caddy_internal_10.import: "/data/ha-routing/ingress.caddy unbottled-app:3000 72.61.156.49 s2"
      caddy_internal_14: "http://:19381"
      caddy_internal_14.import: "/data/ha-routing/origin.caddy unbottled-app:3000 unbottled-app:3000 unbottled-app:3099 unbottled-ha-warm"
      caddy_internal_15: "http://:19382"
      caddy_internal_15.import: "/data/ha-routing/peer.caddy 72.61.156.49"
      caddy_internal_11: "https://www.unbottled.ai"
      caddy_internal_11.tls.issuer: "acme"
      caddy_internal_11.tls.issuer.disable_tlsalpn_challenge: ""
      caddy_internal_11.redir: "https://unbottled.ai{uri} 308"

      caddy_internal_12: "https://s2.unbottled.ai"
      caddy_internal_12.reverse_proxy: "127.0.0.1:19381"
      caddy_internal_12.reverse_proxy.header_up_0: "X-HA-Client {remote_host}"
      caddy_internal_12.reverse_proxy.header_up_1: "X-HA-Host {host}"
      caddy_internal_12.reverse_proxy.header_up_2: "-X-HA-First"

      caddy_internal_13: "http://unbottled.ai, http://www.unbottled.ai"
      caddy_internal_13.@acme_to_peer.path: "/.well-known/acme-challenge/*"
      caddy_internal_13.@acme_to_peer.not.header: "X-HA-Acme-Fwd *"
      caddy_internal_13.handle_0: "@acme_to_peer"
      caddy_internal_13.handle_0.reverse_proxy: "10.88.0.1:80"
      caddy_internal_13.handle_0.reverse_proxy.header_up_0: "Host {host}"
      caddy_internal_13.handle_0.reverse_proxy.header_up_1: "X-HA-Acme-Fwd 1"
      caddy_internal_13.handle_1: "/.well-known/acme-challenge/*"
      caddy_internal_13.handle_1.respond: "404"
      caddy_internal_13.handle_2.redir: "https://{host}{uri} 308"

networks:
  caddy_internal:
    external: true
