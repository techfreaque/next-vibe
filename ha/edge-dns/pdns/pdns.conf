# PowerDNS authoritative server — self-hosted edge for unbottled.ai.
# BIND backend (plain zone file), rendered + reloaded by the health daemon.
#
# Binds to this node's PUBLIC IP on :53 only (NODE_PUBLIC_IP is substituted by
# edge-up.sh per box). It must NOT bind 0.0.0.0:53 — systemd-resolved owns
# 127.0.0.53:53 and a container publishing 0.0.0.0:53 would also hijack the
# loopback resolver path. We publish NODE_PUBLIC_IP:53 (and the WG IP for
# intra-fleet lookups) explicitly via the compose `ports:` mapping instead.

launch=bind
bind-config=/etc/powerdns/named.conf

# Answer only the zones we are authoritative for; no recursion (authoritative NS).
# (recursion is off by default in the auth server; stated for clarity)
local-address=0.0.0.0
local-port=53

# Operational
setgid=pdns
setuid=pdns
log-dns-queries=no
loglevel=4
default-ttl=3600

socket-dir=/var/run/pdns

# BIND backend auto-reload: re-stat every zone file every 5s and reload the
# ones whose mtime/serial changed. This is what lets the ha-dns-health daemon
# drive failover by simply REWRITING the zone file (bumped serial) — no control
# socket, no shared binary. Failover latency gains at most this interval.
bind-check-interval=5

# AXFR is disabled (each node authors its own apex A from its own health view;
# we deliberately do NOT zone-transfer between nodes — see README).
disable-axfr=yes
