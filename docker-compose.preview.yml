services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: ${COMPOSE_PROJECT_NAME:-next-vibe}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hermes
    volumes:
      - hermes_data:/var/lib/postgresql/data
    ports:
      - "${PREVIEW_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  hermes_data:
