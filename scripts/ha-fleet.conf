# ha-fleet.conf — declares the HA app fleet that scripts/deploy-ha.sh rolls.
#
# One line per NODE. Columns (pipe-separated, surrounding spaces trimmed):
#
#   name | ssh_host | compose_dir | compose_files | primary | health_target | replicas
#
#   name           logical node name. deploy-ha.sh maps it to an SSH password:
#                  *server1*/*srv1*/*primary* → SSH_SERVER_PWD
#                  *server2*/*srv2*           → SSH_SERVER2_PWD
#                  anything else              → SSH_<NAME_UPPER>_PWD  (add to .env)
#   ssh_host       user@host for ssh (e.g. root@unbottled.ai). Creds from .env.
#   compose_dir    dir on the node holding the compose files + .env.
#   compose_files  space-joined `-f ...` list passed to `docker compose`.
#   primary        1 for the node co-located with the Postgres PRIMARY (rolled
#                  LAST, and the node the one-off migration runs on). Exactly one.
#   health_target  how deploy-ha.sh checks a freshly-recreated REPLICA is live.
#                  Two forms:
#                    exec            → `docker exec <replica> curl -sf
#                                      localhost:3000/robots.txt` (the HA model:
#                                      replicas have NO host port, reached only
#                                      via the node's Caddy LB; /robots.txt is
#                                      app-served + unauth + 200-only-when-serving;
#                                      the app's /health needs auth → unusable).
#                    http://IP:PORT  → curl that base + "/" expecting 2xx/3xx
#                                      (legacy single-container-with-host-port
#                                      nodes, e.g. the pre-cutover shared-prod
#                                      test node on 10.88.0.2:3100).
#   replicas       app-container count on this node. The node's Caddy LB block
#                  (ha/edge-lb/unbottled.ai.lb.caddy) and the replicas overlay
#                  (ha/edge-lb/docker-compose.replicas.yml) must list the same
#                  count. Container names: <APP_CONTAINER_NAME>, -2, -3, …
#
# If this file is absent, deploy-ha.sh falls back to a built-in 2-node default
# (server2 then server1) with SSH hosts read from .env.
#
# ═══════════════════════════════════════════════════════════════════════════
# TWO fleet shapes — uncomment the one that matches the phase you are in.
# ═══════════════════════════════════════════════════════════════════════════

# ── PRE-CUTOVER (today): server2 = shared-prod TEST node, 1 container on a host
#    port (3100), reached directly. server1 = prod, untouched, 1 container.
#    Safe to roll server2 anytime; server1 only in a window.
server2 | root@srv2016195.hstgr.cloud | /root/unbottled | -p unbottled -f docker-compose.prod.yml -f docker-compose.standalone.yml -f docker-compose.s2-ha.yml | 0 | http://10.88.0.2:3100 | 1
server1 | root@unbottled.ai           | /unbottled      | -f docker-compose.prod.yml                                                                                                            | 1 | http://10.88.0.1:3000 | 1

# ── POST-CUTOVER (active-active, N replicas per box behind each box's Caddy LB,
#    self-hosted PowerDNS round-robin edge — NO VIP, NO keepalived). Each box
#    runs its OWN postgres? No: ONE shared primary (the `primary` node); the
#    other box's app writes to it over WireGuard. Replicas reached via Caddy →
#    health_target = exec. Uncomment at cutover and comment the block above:
#
# server2 | root@srv2016195.hstgr.cloud | /root/unbottled | -f docker-compose.prod.yml -f docker-compose.shared-prod.yml -f ha/edge-lb/docker-compose.replicas.yml | 0 | exec | 2
# server1 | root@unbottled.ai           | /unbottled      | -f docker-compose.prod.yml -f ha/edge-lb/docker-compose.replicas.yml                                   | 1 | exec | 2
