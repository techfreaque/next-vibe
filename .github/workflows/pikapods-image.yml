name: Publish self-hosted pod image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ${{ vars.POD_IMAGE_RUNNER || 'pod-image-builder' }}
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pod-ci-only
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Select the release image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/next-vibe-pod:$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build the tagged source
        run: |
          docker buildx build --platform linux/amd64 --load -t "$IMAGE" -f Dockerfile.pikapods \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${IMAGE##*:}" .
      - name: Check image size, port, and volume
        run: |
          bytes=$(docker image inspect -f '{{.Size}}' "$IMAGE")
          echo "Uncompressed image size is $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 3221225472
          test "$(docker image inspect -f '{{json .Config.ExposedPorts}}' "$IMAGE")" = '{"3000/tcp":{}}'
          test "$(docker image inspect -f '{{json .Config.Volumes}}' "$IMAGE")" = '{"/data":{}}'
      - name: Verify clean install and restart
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
          POD_NETWORK: ${{ job.services.postgres.network }}
          DATABASE_URL: postgres://pod_owner:pod-owner-ci-only@postgres:5432/pod
        run: |
          docker exec -i "$POSTGRES_SERVICE" psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pod_owner LOGIN PASSWORD 'pod-owner-ci-only';
          CREATE DATABASE pod OWNER pod_owner;
          SQL
          bash scripts/pikapods/smoke.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: |
          docker push "$IMAGE"
          # Move :latest only for the highest stable release, never for a backport.
          highest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [[ "$highest" == "${IMAGE##*:}" ]]; then
            docker tag "$IMAGE" "${IMAGE%:*}:latest"
            docker push "${IMAGE%:*}:latest"
            echo "Published ${IMAGE%:*}:latest" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify anonymous registry access
        run: |
          public_config=$(mktemp -d)
          docker --config "$public_config" manifest inspect "$IMAGE" >/dev/null
